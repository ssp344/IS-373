name: Build and Test Website

on:
  push:
    branches: [main, qa]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Publish environment image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_NAME" = "qa" ]; then
            TAG=qa
          else
            TAG=production
          fi
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

      - name: Deploy to DigitalOcean
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          if [ "$GITHUB_REF_NAME" = "qa" ]; then
            SERVICE=qa
          else
            SERVICE=production
          fi
          ssh -i ~/.ssh/deploy_key \
            "$DROPLET_USER@$DROPLET_HOST" \
            "sudo docker compose -f /opt/is373/compose.yaml pull $SERVICE && sudo docker compose -f /opt/is373/compose.yaml up -d --no-deps $SERVICE"
